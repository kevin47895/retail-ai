{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-3 px-md-4 py-4 text-light">

    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary flex-wrap gap-3">
        <div>
            <h2 class="text-white fw-bold m-0 fs-3"><i class="bi bi-people text-info me-2"></i> Gestión de Usuarios</h2>
            <p class="text-secondary small m-0 mt-1">Administración de accesos y roles del sistema</p>
        </div>
        <button class="btn btn-primary px-4 fw-medium shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCrear">
            <i class="bi bi-plus-lg me-2"></i> Nuevo Usuario
        </button>
    </div>

    <div class="card bg-slate-900 border-slate-800 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0" style="--bs-table-bg: transparent;">
                    <thead class="border-bottom border-slate-800 text-secondary small text-uppercase">
                        <tr>
                            <th class="px-4 py-3">Usuario</th>
                            <th class="py-3">Nombre Completo</th>
                            <th class="py-3">Rol</th>
                            <th class="py-3">Estado</th>
                            <th class="px-4 py-3 text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="border-slate-800">
                        {% for u in usuarios %}
                        <tr>
                            <td class="px-4 py-3 text-white fw-medium">{{ u[1] }}</td>
                            <td class="py-3 text-secondary">{{ u[2] }}</td>
                            <td class="py-3">
                                <span class="badge bg-slate-800 border border-slate-700 text-light px-2 py-1 text-uppercase">{{ u[3] }}</span>
                            </td>
                            <td class="py-3">
                                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1">
                                    <i class="bi bi-circle-fill me-1" style="font-size: 6px;"></i> {{ u[4] }}
                                </span>
                            </td>
                            <td class="px-4 py-3 text-end">
                                <form action="/usuarios/eliminar/{{ u[0] }}" method="POST" class="d-inline" onsubmit="return confirm('¿Eliminar usuario definitivamente?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Registrar usuario -->
<div class="modal fade" id="modalCrear" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-light border-slate-800 shadow-lg" style="background-color: #1e293b;">
            <form method="POST" action="/usuarios/crear">
                <div class="modal-header border-slate-800">
                    <h5 class="modal-title fw-semibold text-white"><i class="bi bi-person-plus me-2 text-info"></i> Registrar Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Nombre Completo</label>
                        <input type="text" class="form-control text-light border-slate-700 bg-slate-950 shadow-none" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Nombre de Usuario (Login)</label>
                        <input type="text" class="form-control text-light border-slate-700 bg-slate-950 shadow-none" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Contraseña (mínimo 8 caracteres)</label>
                        <input type="password" class="form-control text-light border-slate-700 bg-slate-950 shadow-none" name="password" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Asignar Rol</label>
                        <select class="form-select text-light border-slate-700 bg-slate-950 shadow-none" name="rol_id" required>
                            {% for r in roles %}
                            <option value="{{ r[0] }}">{{ r[1] | capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-slate-800">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
